<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train Blocks</title>
    <link rel="icon" href="./assets/watermelon.svg" type="image/svg+xml" />
    <!-- Keep in sync with auths/front/index.html -->
    <script>
      (function () {
        var stored;
        try {
          stored = localStorage.getItem('tp-theme');
        } catch (e) {}
        var preference =
          stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          preference === 'dark' || (preference !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
