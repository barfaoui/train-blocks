services:
  postgres:
    image: postgres:16
    container_name: training-planning-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-training_planning}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-training_planning}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Catches every email the services send, locally. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: training-planning-mail
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres_data:
